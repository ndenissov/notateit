[project]
name = "notateit"
version = "1.0.4"
description = "Notateit Viewer Remake"
authors = [
    { name = "Nikita Denissov", email = "n.denissov@proton.me" }
]
readme = "README.md"
requires-python = ">=3.8,<3.15"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Graphics :: Viewers",
]
[tool.poetry.dependencies]

pyside6 = [
    { version = ">=6.6.3,<7.0.0", python = ">=3.8,<3.10" },
    { version = ">=6.11.1,<7.0.0", python = ">=3.10" }
]
pillow = [
    { version = ">=10.4.0,<13.0.0", python = ">=3.8,<3.10" },
    { version = ">=12.3.0,<13.0.0", python = ">=3.10" }
]

[project.urls]
Homepage = "https://github.com/ndenissov/notateit"
Repository = "https://github.com/ndenissov/notateit"

[project.scripts]
notateit = "notateit.__main__:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "notateit" }]
include = ["notateit/notateit_remake.png"]
